[package]
name = "slop-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
color-eyre = "0.6.5"
data-encoding = "2"
eventsource-stream = "0.2"
eyre = "0.6.14"
futures-util = "0.3"
hmac-sha256 = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
pound = "0.1.6"
rand = "0.8"
reqwest = {
	version = "0.12",
	default-features = false,
	features = [
		"rustls-tls",
		"stream",
		"json",
		"cookies",
		"gzip",
	],
}
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
